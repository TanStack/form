maintainer_guidance:
  adapter_first: true
  primary_user_entrypoint: '@tanstack/react-form'
  secondary_user_entrypoint: '@tanstack/solid-form'
  core_role: 'Concept and implementation source, not a user workflow entrypoint.'
  primary_adapter_status:
    react: 'Most complete adapter; use as primary examples and skill target.'
    solid: 'Important adapter but missing critical planned pieces; avoid Solid-first coverage for now.'
  schema_modes:
    default_form_options:
      summary: 'DefaultValues-first inference.'
      use_when:
        - 'The form type should be inferred from defaultValues.'
        - 'Validation is mostly callback-based and callbacks should receive a value type derived from defaultValues.'
      properties:
        - 'defaultValues is taken at face value.'
        - 'The inferred defaultValues type is used for validators and callbacks.'
        - 'This mode is often the simplest choice when no schema should own the form type.'
    strict_schema:
      summary: 'Schema-source pipeline mode.'
      use_when:
        - 'The schema is a transforming pipeline from input type to output type.'
        - 'The schema should be the source for form typing.'
      properties:
        - 'defaultValues must align with the schema input type and should produce type errors when they do not.'
        - 'Callbacks may not have useful inference unless a schema is present in the validator array.'
        - 'onSubmit should read the transform output from schemaOutputs instead of raw value.'
    loose_schema:
      summary: 'Schema-source ruleset mode with editable defaults.'
      use_when:
        - 'The schema is a ruleset for confirming valid output, but the editable form state needs nullable or undefined starting values.'
        - 'A schema such as z.date() needs a starting value like null before the user has chosen a date.'
      properties:
        - 'The input is looser while the parsed submit output is still the schema output type.'
        - 'defaultValues must still align with the schema shape, but properties may also be null or undefined where editing requires it.'
        - 'Callbacks may not have useful inference unless a schema is present in the validator array.'
        - 'onSubmit should read the transform output from schemaOutputs instead of raw value.'
  schema_ecosystem:
    standard_schema:
      role: 'Most common integration shape.'
      note: 'Standard Schema is an interoperability interface, not a pipeline-vs-ruleset classification system.'
      source: 'https://standardschema.dev/'
    pipeline_vs_ruleset_heuristic:
      status: 'maintainer commentary'
      meaning: 'A mental model for deciding TanStack Form option mode: is the schema written as a pipeline of constraints/transforms, or as a firewall that only lets already-valid values through?'
      caution: 'This is not part of Standard Schema and should not be presented as a Standard Schema concept.'
    validation_libraries_as_of_2026_06_25:
      - name: Zod
        standard_schema_support: 'Supported; Zod docs recommend Standard Schema for schema-agnostic black-box validation and say Zod is included among compatible libraries.'
        general_leaning: 'ruleset/firewall-leaning by default'
        tanstack_form_bias: 'Often looseSchema for editable forms, with strictSchema only when a Zod schema is deliberately authored as a transform pipeline.'
        source: 'https://zod.dev/library-authors'
      - name: Valibot
        standard_schema_support: 'Implements Standard Schema v1.'
        general_leaning: 'pipeline-leaning'
        tanstack_form_bias: 'Often strictSchema when the schema is authored as an input-to-output pipeline.'
        source: 'https://valibot.dev/guides/integrate-valibot/'
      - name: ArkType
        standard_schema_support: 'Supports and co-authored Standard Schema; can consume Standard Schema validators as definitions.'
        general_leaning: 'mixed; structural firewall constraints with morph/pipe support for pipeline-style transforms'
        tanstack_form_bias: 'Choose by the actual schema intent rather than the library name.'
        source: 'https://arktype.io/docs/integrations'
      - name: Effect Schema
        standard_schema_support: 'Can generate Standard Schema V1 via Schema.standardSchemaV1 for schemas without dependencies.'
        general_leaning: 'pipeline/codec-leaning because schemas distinguish decoded Type from Encoded input and support decoding/encoding.'
        tanstack_form_bias: 'Often strictSchema when the Effect schema is used as an encoded-to-decoded boundary.'
        source: 'https://effect.website/docs/schema/standard-schema/'
  query_shape:
    async_defaults: 'Incoming values are often maybe undefined while data loads.'
    default_values_plan: 'Do not pass query data alone as form defaults; either gate mounted fields/form until data is ready, or coalesce query data with a static shape-complete emptyFormValues object. Neither strategy is preferred globally.'
    visual_language: 'Gating fields or the whole form changes the visual UI language because the form appears only after data is ready; an emptyFormValues fallback can render the form immediately with loading or placeholder state.'
    submit: 'Use an async promise for endpoint calls so isSubmitting reflects the request. Catch submit errors only when they can produce validation errors that must be returned as values. Transient thrown/rejected errors may remain thrown; they set isSubmitSuccessful to false while external query/framework state preserves the error.'
  hard_do_nots:
    - id: no_type_assertions
      rule: 'Do not type assert to make TanStack Form code compile; preserve inference and fix the mismatched API boundary.'
      bad_patterns:
        - 'name={`users[${index}].name` as const}'
        - '{(field: any) => ...}'
        - 'field: { value: string }'
      preferred_patterns:
        - 'Let field names infer without as const.'
        - 'Let form.Field render-prop children infer their field type.'
        - 'Use FieldWithValue<T> or AnyFieldApi when a reusable component needs an explicit field prop type.'
    - id: validation_errors_are_not_transient_errors
      rule: 'Do not store query, network, or framework transient failures as form validation errors.'
      reason: 'Validation errors from validators or onSubmit block the user from submitting; transient errors should use the query or framework error state.'
      preferred_patterns:
        - 'Use an async promise for endpoint calls so isSubmitting reflects the request.'
        - 'Return createValidationError or parseIssues only for validation-shaped server responses.'
        - 'Keep retryable network/server failures in the query or framework layer; they may throw or reject as transient failures.'
    - id: validation_errors_are_values
      rule: 'Do not throw validation errors from validators or onSubmit.'
      reason: 'Validation errors must be returned values. Thrown/rejected errors are submit failures, not validation state.'
      preferred_patterns:
        - 'Return createValidationError(...) from onSubmit for validation failures.'
        - 'Return parseIssues(...) when converting Standard Schema issues.'
        - 'Let transient endpoint failures reject if the surrounding query/framework preserves the error state.'
    - id: no_react_form_type_unions
      rule: 'Do not type shared sections as unions of multiple ReactFormType forms.'
      bad_patterns:
        - 'form: ReactFormType<typeof formAOptions> | ReactFormType<typeof formBOptions>'
      reason: 'TypeScript cannot make useful sense of different form API unions for field names and methods.'
      preferred_patterns:
        - 'Use ReactFormType<typeof sharedOptions> for splitting one known form into sections.'
        - 'Use field groups when a reusable section should bind into multiple different forms or paths.'
  excluded_from_current_skills:
    - devtools_as_entrypoint
    - migration_guidance
    - schema_metadata_extraction
    - non_validation_error_state_ownership
    - ui_library_behavior_itself
    - solid_first_examples
