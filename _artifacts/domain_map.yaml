domains:
  - id: react-adapter-composition
    title: React Adapter Composition
    description: 'How users compose headless React forms, reusable field components, app form contexts, field groups, arrays, and UI-library bindings through @tanstack/react-form.'
    package_focus:
      - '@tanstack/react-form'
      - '@tanstack/form-core'
    core_questions:
      - 'Should this be a one-off useForm example, an app-form setup, or a field-group composition?'
      - 'Which pieces need to be reusable without over-constraining submit types?'
      - 'Is this reducing nesting in one known form, reducing field JSX boilerplate, or reusing a section across forms?'
      - 'Should split child components receive a form prop typed with ReactFormType derived from shared options, or should the section be a field group?'
      - 'Does the example need field arrays or reorder behavior?'
    related_skills:
      - react-form-composition-setup
      - examples-authoring
      - type-error-debugging
  - id: schema-driven-forms
    title: Schema Driven Forms
    description: 'How Standard Schema-compatible schemas influence form option mode, validation, field error routing, submit output, and TypeScript inference.'
    package_focus:
      - '@tanstack/react-form'
      - '@tanstack/form-core'
    core_questions:
      - 'Is the schema a pipeline from input A to output B, or a ruleset for confirming B?'
      - 'Should submit logic read raw value or schemaOutputs?'
      - 'Do defaults need to be nullable or maybe undefined while editing?'
    related_skills:
      - choosing-form-options-modes
      - schema-driven-forms
      - type-error-debugging
  - id: async-data-and-submit
    title: Async Data And Submit
    description: 'How query-like loading data and mutation-like submit functions interact with default values, touched fields, validation errors, and transient errors.'
    package_focus:
