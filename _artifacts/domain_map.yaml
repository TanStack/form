skill_candidates:
  - id: react-form-composition-setup
    title: React Form Composition Setup
    status: reviewed
    priority: high
    domain: react-adapter-composition
    purpose: 'Help users build adapter-first React forms, reusable components, app-form setups, field groups, and UI-library bindings.'
    entrypoints:
      - '@tanstack/react-form/useForm'
      - '@tanstack/react-form/ReactFormType'
      - '@tanstack/react-form/FieldWithValue'
      - '@tanstack/react-form/AnyFieldApi'
      - '@tanstack/react-form/formOptions'
      - '@tanstack/react-form/createFormHook'
      - 'form.Field'
      - 'form.ArrayField'
      - 'form.Subscribe'
      - 'form.FormGroup'
    sources:
      - packages/react-form/src/ReactForm/Components.public.ts
      - packages/react-form/src/ReactForm/fieldSubscriptions.lib.ts
      - packages/react-form/src/AppForm/createFormHook.public.ts
      - packages/react-form/src/FieldGroup/withFields.public.ts
      - packages/react-form/tests/submit-return.test-d.tsx
      - packages/form-core/src/FormApi/FormApiArrayMethods.types.public.ts
      - packages/form-core/src/FieldApi/fieldState.lib.ts
      - examples/react/array/src/index.tsx
      - examples/react/basic-splitting-form/src/index.tsx
      - examples/react/ui-integration/shadcn/src/components/form/app-form.ts
    teaches:
      - 'Prefer adapter APIs over constructing core APIs directly.'
      - 'Use render-prop field APIs and subscriptions instead of copying form state into component state.'
      - 'Treat useForm and useAppForm as stable form creation hooks, not reactive state reads.'
      - 'Use useSelector or form.Subscribe when component output must react to form state.'
      - 'Keep reusable shared options submit-agnostic when child components should accept multiple submit implementations.'
      - 'Use ReactFormType<typeof sharedOptions> as one option for splitting a known form into child components that receive a form prop.'
      - 'Do not union multiple ReactFormType forms for shared sections; use field groups when a section must bind into multiple different forms or paths.'
      - 'Use AppForm to reduce repeated field JSX boilerplate; use split form sections to reduce component nesting; use field groups for reusable sections across forms or paths.'
      - 'Let field names and form.Field children infer; use FieldWithValue<T> or AnyFieldApi for explicit reusable field component props.'
      - 'form.Field may bind an array value; it behaves immutably like other fields, so any element change changes the array value and rerenders whole-array consumers.'
      - 'Use form.ArrayField when an array is a rendering boundary for child fields or list items; ArrayField subscriptions follow array shape/version changes instead of treating value as the whole render unit.'
      - 'Use field groups for reusable sections with virtual-to-real field bindings.'
    failure_modes:
      - name: type_asserting_form_inference
        symptom: 'Code adds as const to field names, annotates render-prop children as any, or uses as any to force form code to compile.'
        correction: 'Remove the assertion and let names, children, and form helpers infer the types.'
        evidence:
          - maintainer_guidance.hard_do_nots
          - packages/react-form/src/ReactForm/Components.public.ts
      - name: shimmed_field_prop_type
        symptom: 'A reusable component accepts a hand-written field shape like field: { value: string }.'
        correction: 'Use inferred render-prop types, FieldWithValue<T>, or AnyFieldApi instead of a structural shim.'
        evidence:
          - examples/react/basic-splitting-form/src/StringField.tsx
          - examples/react/basic-splitting-form/src/FieldError.tsx
      - name: expecting_hook_reactivity
        symptom: 'A component reads form.state or derived flags from the stable useForm/useAppForm return and does not re-render when form state changes.'
        correction: 'Use useSelector with form.atom or a field/group atom, or use form.Subscribe with an explicit selector.'
        evidence:
          - packages/react-form/src/ReactForm/ReactFormApi.lib.tsx
          - packages/react-form/src/Subscribe.public.tsx
          - packages/react-form/src/ReactForm/fieldSubscriptions.lib.ts
          - examples/react/ui-integration/dnd-kit/src/twoLists/index.tsx
      - name: core_as_user_entrypoint
        symptom: 'Example imports @tanstack/form-core or constructs FormApi in React application code.'
        correction: 'Use @tanstack/react-form APIs; treat core as concept and implementation source.'
        evidence:
          - maintainer_guidance.core_role
          - packages/react-form/src/ReactForm/useForm.public.ts
      - name: app_components_outside_provider
        symptom: 'App field or form components throw because they are rendered outside form.Field or form.AppForm.'
        correction: 'Wrap custom form components in the app-form provider pattern created by createFormHook.'
        evidence:
          - packages/react-form/src/AppForm/contexts.lib.ts
          - examples/react/ui-integration/shadcn/src/components/form/app-form.ts
      - name: over_specific_shared_form_type
        symptom: 'A reusable child form prop rejects a parent form once onSubmit is added.'
        correction: 'Keep shared options without onSubmit when reusable children should stay submit-agnostic.'
        evidence:
          - packages/react-form/src/ReactForm/formType.public.ts
          - packages/react-form/tests/submit-return.test-d.tsx
      - name: split_form_without_react_form_type
        symptom: 'A split form section hand-writes a large form prop type or loses field-name inference.'
        correction: 'Export shared form options and type the prop as ReactFormType<typeof sharedFormOptions>.'
        evidence:
          - examples/react/basic-splitting-form/src/FormSection.tsx
          - docs/framework/react/reference/type-aliases/ReactFormType.md
      - name: react_form_type_union_shared_section
        symptom: 'A shared section accepts a union like ReactFormType<typeof formAOptions> | ReactFormType<typeof formBOptions> and TypeScript cannot resolve field names or methods.'
        correction: 'Use field groups for reusable sections across forms, or use ReactFormType only for one known shared options type.'
        evidence:
          - maintainer_guidance.hard_do_nots
          - packages/react-form/src/FieldGroup/withFields.public.ts
      - name: field_used_for_rendering_array_children
        symptom: 'A Field bound to an array value is used as the boundary for rendering item fields, and item updates rerender the whole array-value consumer.'
        correction: 'Use ArrayField at the list boundary, then render item Fields for the values that should update independently.'
        evidence:
          - examples/react/array/src/index.tsx
          - packages/react-form/src/ReactForm/fieldSubscriptions.lib.ts
          - packages/form-core/src/FieldApi/fieldState.lib.ts
      - name: array_field_assumed_required_for_any_array_value
        symptom: 'Code reaches for ArrayField only because the field value is an array, even though the array is consumed as one immutable value.'
        correction: 'Use Field when the array is a single field value; reserve ArrayField for rendering child fields or list items.'
        evidence:
          - packages/react-form/src/ReactForm/Components.public.ts
          - packages/react-form/src/ReactForm/fieldSubscriptions.lib.ts
      - name: raw_array_mutation
        symptom: 'Array item values and field meta fall out of sync after splice, reorder, or manual setFieldValue.'
        correction: 'Use pushFieldValue, insertFieldValue, removeFieldValue, swapFieldValues, moveFieldValue, clearFieldValues, or filterFieldValues.'
        evidence:
          - packages/form-core/src/FormApi/array-methods.lib.ts
          - packages/form-core/src/FormApi/FormApiArrayMethods.types.public.ts
          - packages/form-core/tests/FormApi/field-array-methods.spec.ts
  - id: reusable-form-policies
    title: Reusable Form Policies
    status: reviewed
    priority: high
    domain: validation-and-error-visibility
    purpose: 'Help users extract split-form types, error visibility callbacks, and validator configs into named reusable helpers when the behavior deserves semantic intent.'
    entrypoints:
      - '@tanstack/react-form/ReactFormType'
      - 'createErrorVisibility'
      - 'createValidator'
      - 'createValidators'
      - 'shared formOptions'
      - 'shared appFormOptions'
    sources:
      - examples/react/basic-splitting-form/src/FormSection.tsx
      - examples/react/basic-splitting-form/src/sharedForm.ts
      - packages/react-form/tests/submit-return.test-d.tsx
      - packages/form-core/tests/validation.test.ts
      - packages/form-core/tests/validation.test-d.ts
      - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
    teaches:
      - 'Use ReactFormType<typeof sharedOptions> as the helper type for split form sections that receive a form prop.'
      - 'ReactFormType splitting reduces nesting in one known form; AppForm reduces repeated field JSX; field groups cover sections reused across different forms or paths.'
      - 'Prefer form-level errorVisibility callbacks over repeated local showErrors checks.'
      - 'Use helper functions when a callback or validator config deserves a semantic name that preserves intent.'
      - 'Use comments or JSDoc on named helpers to explain workflow behavior, trigger timing, debounce, bailIfInvalid, runOnSubmit, or rewardEarlyPunishLate policy.'
      - 'Keep reusable visibility policies value-agnostic unless they are intentionally tied to one form shape; use inline callbacks when typed values are required.'
    failure_modes:
      - name: split_form_type_written_by_hand
        symptom: 'A split form section loses field-name inference because its form prop type is hand-written.'
        correction: 'Export shared options and type the prop as ReactFormType<typeof sharedOptions>.'
        evidence:
          - examples/react/basic-splitting-form/src/FormSection.tsx
          - packages/react-form/tests/submit-return.test-d.tsx
      - name: reusable_section_uses_react_form_type_union
        symptom: 'A shared section accepts FormA | FormB and TypeScript cannot narrow field names or methods.'
        correction: 'Use field groups for shared sections that need to work across different forms or paths.'
        evidence:
          - maintainer_guidance.hard_do_nots
          - packages/react-form/src/FieldGroup/withFields.public.ts
      - name: scattered_show_errors_policy
        symptom: 'Each field repeats local showErrors logic such as field.meta.isTouched && field.meta.isInvalid.'
        correction: 'Move default visible-error behavior into form-level errorVisibility, or extract a named createErrorVisibility helper.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
          - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
      - name: duplicated_validator_config_without_intent
        symptom: 'Trigger, debounce, runOnSubmit, or bailIfInvalid config is copied without explaining the intended workflow.'
        correction: 'Extract a named createValidator/createValidators helper and document the behavior intent.'
        evidence:
          - packages/form-core/tests/validation.test.ts
          - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
      - name: reusable_visibility_reads_concrete_values
        symptom: 'A reusable createErrorVisibility callback tries to read a concrete property such as state.values.name.'
        correction: 'Keep reusable policies value-agnostic, or use an inline errorVisibility callback when concrete typed values are needed.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
  - id: choosing-form-options-modes
    title: Choosing Form Options Modes
    status: reviewed
    priority: high
    domain: schema-driven-forms
    purpose: 'Help users choose default formOptions, strictSchema, or looseSchema based on whether the schema is a transform pipeline or a validation ruleset.'
    entrypoints:
      - '@tanstack/react-form/formOptions'
      - '@tanstack/react-form/formOptions.strictSchema'
      - '@tanstack/react-form/formOptions.looseSchema'
      - '@tanstack/react-form/appFormOptions'
      - '@tanstack/react-form/appFormOptions.strictSchema'
      - '@tanstack/react-form/appFormOptions.looseSchema'
    sources:
      - packages/form-core/src/utils.public.ts
      - packages/react-form/src/AppForm/appFormOptions.public.ts
      - packages/form-core/tests/validation.test.ts
      - packages/form-core/tests/validation.test-d.ts
      - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
    teaches:
      - 'The option helpers are runtime identity helpers with type-level meaning.'
      - 'Default formOptions infers from defaultValues; those values are taken at face value and drive validator callback value types.'
      - 'strictSchema uses the schema as the typing source for a transforming input-to-output pipeline.'
      - 'strictSchema defaultValues must align with the schema input type and should fail type-checking when they do not.'
      - 'looseSchema uses the schema as a ruleset while allowing editable default values that include null or undefined where needed.'
      - 'looseSchema defaultValues must still align with the schema shape, but the input can be looser while output remains schema output.'
      - 'In schema modes, callbacks may not infer usefully unless a schema is present in the validator array.'
      - 'In schema modes, onSubmit should read schemaOutputs instead of raw value.'
      - 'Use Standard Schema-capable libraries as heuristic examples only: Zod generally leans ruleset/firewall, Valibot generally leans pipeline, ArkType is mixed, and Effect Schema often leans pipeline/codec.'
    failure_modes:
      - name: expecting_option_helper_runtime_behavior
        symptom: 'User expects strictSchema or looseSchema to add validation without validators.'
        correction: 'Explain that the helper shapes inference; validation still comes from configured validators.'
        evidence:
          - packages/form-core/src/utils.public.ts
          - packages/form-core/tests/validation.test.ts
      - name: schema_expected_to_type_default_form_options
        symptom: 'User chooses default formOptions but expects a schema to own the form data type.'
        correction: 'Use default formOptions for defaultValues-first inference, or choose a schema mode when the schema should be the typing source.'
        evidence:
          - maintainer_guidance.schema_modes
          - packages/form-core/src/utils.public.ts
      - name: strict_ruleset_schema_blocks_editing
        symptom: 'Defaults or field values cannot represent empty, null, or partial UI states because strict schema typing is too narrow.'
        correction: 'Use looseSchema or default formOptions when the schema is a ruleset validating final form shape.'
        evidence:
          - maintainer_guidance.schema_modes
          - packages/form-core/src/utils.public.ts
      - name: loose_schema_shape_mismatch
        symptom: "Loose schema defaults include null or undefined but no longer match the schema's object shape or field structure."
        correction: 'Keep the defaultValues shape aligned with the schema while allowing null or undefined where editable state needs it.'
        evidence:
          - maintainer_guidance.schema_modes
          - packages/form-core/src/utils.public.ts
      - name: schema_mode_without_schema_validator
        symptom: 'Callbacks in strictSchema or looseSchema mode do not infer the expected value type.'
        correction: 'Put a schema in the validator array so the helper has a schema source to infer from.'
        evidence:
          - maintainer_guidance.schema_modes
          - packages/form-core/tests/validation.test-d.ts
      - name: loose_pipeline_schema_loses_transform_intent
        symptom: 'Submit logic treats raw form value as if it were the transformed schema output.'
        correction: 'Use strictSchema for pipeline schemas and read the transformed value from schemaOutputs.'
        evidence:
          - packages/form-core/tests/validation.test.ts
          - packages/form-core/tests/validation.test-d.ts
      - name: on_submit_reads_value_in_schema_mode
        symptom: 'onSubmit reads value even though strictSchema or looseSchema is being used.'
        correction: 'Read the relevant schemaOutputs entry, because both schema modes preserve raw form value separately from parsed output.'
        evidence:
          - packages/form-core/tests/validation.test.ts
          - packages/form-core/src/FormApi/FormApi.public.ts
      - name: confusing_zod_input_with_pipeline_input
        symptom: 'A Zod schema is treated as a reliable A-to-B pipeline because z.input differs from z.output.'
        correction: 'Start from Zod-as-ruleset guidance unless the specific schema is deliberately written as a transform pipeline.'
        evidence:
          - maintainer_guidance.schema_ecosystem
          - examples/react/ui-integration/shadcn/src/app/booking/schema.ts
  - id: schema-driven-forms
    title: Schema Driven Forms
    status: reviewed
    priority: high
    domain: schema-driven-forms
    purpose: 'Help users turn Standard Schema-compatible schemas into form validators, field errors, typed submit output, and realistic examples.'
    entrypoints:
      - 'validators'
      - 'schemaOutputs'
      - 'parseIssues'
      - 'createValidationError'
      - 'Standard Schema validators'
    sources:
      - packages/form-core/src/standardSchema.public.ts
      - packages/form-core/src/standardSchema.lib.ts
      - packages/form-core/src/FormApi/FormApi.public.ts
      - packages/form-core/tests/validation.test.ts
      - packages/form-core/tests/validation.test-d.ts
      - examples/react/ui-integration/shadcn/src/app/booking/schema.ts
      - examples/react/field-groups/src/index.tsx
    teaches:
      - 'Use Standard Schema-compatible validators in form or field validators.'
      - 'Extract reusable validator trigger configs with createValidator or createValidators when the policy is complex enough to deserve a semantic name.'
      - 'Read parsed schema output from onSubmit context.schemaOutputs.'
      - 'Return validation errors as values through createValidationError or parseIssues; do not throw them.'
      - 'Let Standard Schema issue paths route field errors instead of hand-building brittle path maps.'
    failure_modes:
      - name: assuming_schema_output_replaces_value
        symptom: 'onSubmit reads value expecting transformed/coerced data.'
        correction: 'Use schemaOutputs for parsed schema output; value remains form state.'
        evidence:
          - packages/form-core/src/FormApi/FormApi.public.ts
          - packages/form-core/tests/validation.test.ts
      - name: returning_raw_schema_error
        symptom: 'A submit validator returns or throws raw Zod/Standard Schema errors and the form does not show intended field errors.'
        correction: 'Return parseIssues for Standard Schema issues or createValidationError for explicit form/field errors; validation errors must be values, not thrown errors.'
        evidence:
          - packages/form-core/src/FormApi/FormApi.public.ts
          - packages/form-core/tests/FormApi/submission-handling.spec.ts
      - name: manual_path_mapping
        symptom: 'Nested and array validation errors are routed to the wrong field names.'
        correction: 'Use Standard Schema parsing so paths like user.name and users[0].name are produced consistently.'
        evidence:
          - packages/form-core/src/standardSchema.lib.ts
          - packages/form-core/tests/validation.test.ts
      - name: duplicated_validator_policy
        symptom: 'The same triggers, debounce, runOnSubmit, or bailIfInvalid choices are copied across validators with no explanation.'
        correction: 'Extract a named createValidator/createValidators helper when the policy has semantic meaning, and document why that behavior exists.'
        evidence:
          - packages/form-core/tests/validation.test.ts
          - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
      - name: schema_metadata_expectation
        symptom: 'Example tries to infer required labels, descriptions, or UI decorations from Standard Schema metadata.'
        correction: 'Keep UI metadata explicit or schema-library-specific; Standard Schema does not standardize metadata.'
        evidence:
          - maintainer_guidance.excluded_from_current_skills
  - id: query-backed-forms
    title: Query Backed Forms
    status: reviewed
    priority: high
    domain: async-data-and-submit
    purpose: 'Help users combine forms with query-like async defaults and mutation-like submit calls while separating transient failures from validation errors.'
    entrypoints:
      - 'useForm defaultValues'
      - 'onSubmit'
      - 'form.reset'
      - 'createValidationError'
      - 'parseIssues'
    sources:
      - packages/react-form/tests/useForm.spec.tsx
      - packages/form-core/src/FormApi/FormApi.lib.ts
      - packages/form-core/src/FormApi/FormApi.public.ts
      - packages/form-core/tests/FormApi/default-value.spec.ts
      - packages/form-core/tests/FormApi/submission-handling.spec.ts
    teaches:
      - 'Maybe-undefined incoming data requires an explicit default-values plan, not direct query data alone.'
      - 'Approach 1: gate the fields, or the whole form, until the query is ready so mounted fields start with correct data.'
      - 'Approach 2: define a static shape-complete emptyFormValues object and pass defaultValues as queryData ?? emptyFormValues.'
      - 'Neither approach is preferred globally; choose based on the desired loading and visual UI language.'
      - 'Gating fields changes the UI because fields mount only after data is ready, while an emptyFormValues fallback can show the form immediately.'
      - 'Let updated defaultValues populate untouched fields while preserving user-touched fields.'
      - 'Use an async promise for endpoint calls inside onSubmit so isSubmitting reflects the request.'
      - 'Catch submit errors only when the endpoint can return validation errors that should be converted into createValidationError or parseIssues values.'
      - 'Transient submit errors can throw or reject; they set isSubmitSuccessful to false while query/framework state should preserve the error details.'
      - 'Remember that errors stored from validators or onSubmit block submission, so transient errors should not be converted into validation errors.'
      - 'Use reset semantics deliberately when replacing values and default baselines.'
    failure_modes:
      - name: undefined_data_as_final_shape
        symptom: 'Initial query data is undefined, so fields or schema types collapse into invalid permanent defaults.'
        correction: 'Either gate mounting until data is ready, or coalesce with a static shape-complete emptyFormValues object.'
        evidence:
          - packages/react-form/tests/useForm.spec.tsx
          - maintainer_guidance.query_shape
      - name: query_data_without_fallback_plan
        symptom: 'defaultValues is fed directly from query.data even though query.data can be undefined.'
        correction: 'Use query.data ?? emptyFormValues, or delay mounting fields/form until the query has populated data.'
        evidence:
          - maintainer_guidance.query_shape
          - packages/react-form/tests/useForm.spec.tsx
      - name: ignoring_loading_visual_language
        symptom: 'An example gates fields without accounting for the different loading UI, or renders empty fallback values without communicating that data is still loading.'
        correction: 'Choose the default-values plan together with the intended visual loading language.'
        evidence:
          - maintainer_guidance.query_shape
      - name: overwriting_touched_fields
        symptom: 'Late async defaults replace user edits.'
        correction: "Use the form's defaultValues update behavior, which preserves touched fields and updates untouched fields."
        evidence:
          - packages/form-core/src/FormApi/FormApi.lib.ts
          - packages/react-form/tests/useForm.spec.tsx
      - name: transient_error_as_validation_error
        symptom: 'Network/server outage becomes a visible field validation error.'
        correction: 'Keep transient error state in the query or framework layer; return createValidationError or parseIssues only for validation failures, because stored validation errors block submission.'
        evidence:
          - packages/form-core/tests/FormApi/submission-handling.spec.ts
          - maintainer_guidance.query_shape
      - name: non_async_endpoint_call
        symptom: 'onSubmit starts an endpoint call without returning or awaiting its promise, so isSubmitting does not cover the request.'
        correction: 'Return or await the async endpoint promise from onSubmit.'
        evidence:
          - packages/form-core/tests/FormApi/submission-handling.spec.ts
          - packages/form-core/src/FormApi/handleSubmit.lib.ts
      - name: thrown_validation_error
        symptom: 'onSubmit throws or rejects with validation information and expects field errors.'
        correction: 'Convert validation failures into returned createValidationError or parseIssues values; thrown/rejected errors are submit failures.'
        evidence:
          - packages/form-core/tests/FormApi/submission-handling.spec.ts
          - packages/form-core/src/FormApi/FormApi.public.ts
      - name: rejected_submit_expected_to_show_field_errors
        symptom: 'onSubmit throws or rejects a transient failure and the user expects field errors to appear.'
        correction: 'Let transient failures remain transient and use query/framework error state; only validation failures should be converted into returned validation values.'
        evidence:
          - packages/form-core/tests/FormApi/submission-handling.spec.ts
          - packages/form-core/src/FormApi/FormApi.public.ts
  - id: error-visibility-workflows
    title: Error Visibility Workflows
    status: reviewed
    priority: high
    domain: validation-and-error-visibility
    purpose: 'Help users implement visible-error policies such as show-after-blur, show-after-submit, or custom workflows.'
    entrypoints:
      - 'errorVisibility'
      - 'createErrorVisibility'
      - 'createValidator'
      - 'createValidators'
      - 'fieldState.meta'
      - 'state.submissionAttempts'
      - 'form.FormGroup'
    sources:
      - packages/form-core/src/validation.public.ts
      - packages/form-core/src/FieldApi/fieldState.lib.ts
      - packages/form-core/src/utils.public.ts
      - packages/form-core/tests/validation.test-d.ts
      - packages/form-core/tests/FormApi/validation.spec.ts
      - packages/form-core/tests/FormGroupApi/FormGroupApi.spec.ts
      - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
    teaches:
      - 'errorVisibility is a callback, not a string preset.'
      - 'Use form-level errorVisibility to control default visible-error behavior instead of scattering local checks like field.meta.isTouched && field.meta.isInvalid.'
      - 'Reusable policies can use createErrorVisibility but only receive unknown form values.'
      - 'Helper functions mainly serve to give a semantic name to a callback or validator config.'
      - 'Named reusable policies are good places for JSDoc or comments that explain why errors appear at that moment.'
      - 'Reusable validator configs are useful when they explain trigger timing, bailIfInvalid, debounce, runOnSubmit, or rewardEarlyPunishLate behavior.'
      - 'Inline callbacks can use typed form values from the consuming form.'
      - 'Visibility callbacks see pre-filter meta, not visible errors or validity.'
      - 'Group submission attempts are scoped to the nearest group.'
    failure_modes:
      - name: string_preset
        symptom: "User writes errorVisibility: 'touched' or errorVisibility: 'always'."
        correction: 'Use a callback or createErrorVisibility helper.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
          - packages/form-core/src/validation.public.ts
      - name: scattered_local_error_display
        symptom: 'Each field repeats local showErrors expressions like field.meta.isTouched && field.meta.isInvalid.'
        correction: 'Move default visible-error behavior into form-level errorVisibility.'
        evidence:
          - maintainer_guidance
          - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
      - name: checking_visible_errors_inside_visibility
        symptom: 'Visibility callback tries to inspect fieldState.meta.errors or validity.'
        correction: 'Base visibility on pre-filter meta such as isBlurred, isTouched, isDirty, or submissionAttempts.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
          - packages/form-core/src/FieldApi/fieldState.lib.ts
      - name: reusable_policy_expects_typed_values
        symptom: 'A createErrorVisibility callback tries to read state.values.name with a concrete form type.'
        correction: 'Use inline errorVisibility when typed values are required, or keep reusable policies value-agnostic.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
      - name: undocumented_policy_intent
        symptom: 'A complex visibility or validator trigger policy is copied inline, making agents preserve the code but miss the workflow intent.'
        correction: 'Extract a named helper and use comments or JSDoc to document the intended user behavior.'
        evidence:
          - packages/form-core/tests/validation.test.ts
          - examples/react/ui-integration/shadcn/src/app/booking/shared-form.tsx
      - name: group_submit_scope_surprise
        symptom: 'A wizard section expects form-level submit attempts and group-level submit attempts to be interchangeable.'
        correction: 'Account for nearest group scoping when using state.submissionAttempts in grouped forms.'
        evidence:
          - packages/form-core/tests/FormGroupApi/FormGroupApi.spec.ts
  - id: type-error-debugging
    title: Type Error Debugging
    status: reviewed
    priority: medium
    domain: diagnostics-and-examples
    purpose: 'Help users interpret large TypeScript errors from schemas, option modes, field groups, reusable forms, and adapter APIs.'
    entrypoints:
      - 'ReactFormType'
      - 'FieldWithValue'
      - 'AnyFieldApi'
      - 'formOptions'
      - 'appFormOptions'
      - 'createErrorVisibility'
      - 'createValidators'
      - 'fieldComponent.strict'
      - 'fieldComponent.loose'
      - 'fieldBrand.strict'
      - 'fieldBrand.loose'
      - 'getFieldGroupHelpers'
      - 'DeepKeys'
      - 'DeepValue'
    sources:
      - packages/form-core/tests/validation.test-d.ts
      - packages/form-core/tests/deep-keys.test-d.ts
      - packages/react-form/tests/submit-return.test-d.tsx
      - packages/react-form/tests/FormGroup.test-d.tsx
      - packages/react-form/tests/FieldGroupApi.test-d.tsx
      - packages/react-form/src/AppForm/getFormHookHelpers.public.ts
      - packages/react-form/src/FieldGroup/withFields.public.ts
    teaches:
      - 'Do not use type assertions to silence TanStack Form type errors; preserve inference and fix the mismatched boundary.'
      - 'Classify the error by boundary: option mode, schema output, submit return, reusable child form prop, error visibility state, validator helper arity, form group scope, field group virtual path or binding, field component brand, deep-key path, or public API surface.'
      - 'Treat ReactFormType unions in shared sections as a composition issue; use field groups instead of asserting through the union.'
      - 'Separate schema strict/loose from field component strict/loose; they solve different problems.'
      - 'For long errors, find the first concrete path, value, validator, or submit-return mismatch and ignore expanded generic machinery around it.'
      - 'Reusable createErrorVisibility callbacks are form-agnostic; unknown values usually mean the policy should stay generic or become an inline callback.'
      - 'createValidators type errors usually mean the count of run functions does not match the count of option configs.'
      - 'FormGroup type errors usually mean a root-form path or value was used where group-scoped paths or values are expected.'
      - 'Field-group type errors usually mean real paths were used where virtual paths are expected, a binding map is incomplete, or strict/loose slot compatibility was chosen incorrectly.'
      - 'Deep-key path errors usually point to path shape; arrays use bracket segments and array helpers only accept paths whose value includes an array.'
      - 'Use the first meaningful generic mismatch instead of the full expanded error wall.'
      - 'Check whether the code is trying to use private/internal shape rather than public atom-based APIs.'
    failure_modes:
      - name: assertion_hides_form_inference
        symptom: 'A user adds as const, as any, or a render-prop annotation like field: any to make an error disappear.'
        correction: 'Remove the assertion and follow the inferred API boundary; use FieldWithValue<T> or AnyFieldApi for reusable field props.'
        evidence:
          - maintainer_guidance.hard_do_nots
          - examples/react/basic-splitting-form/src/StringField.tsx
          - examples/react/basic-splitting-form/src/FieldError.tsx
      - name: react_form_type_union
        symptom: 'A shared section types its form prop as a union of multiple ReactFormType aliases.'
        correction: 'Use field groups for shared sections across forms; ReactFormType is for splitting a known form.'
        evidence:
          - maintainer_guidance.hard_do_nots
          - packages/react-form/src/FieldGroup/withFields.public.ts
      - name: reusable_error_visibility_unknown_values
        symptom: 'A createErrorVisibility helper tries to read a concrete property such as state.values.name.'
        correction: 'Keep reusable policies value-agnostic, or use an inline callback when concrete form values are needed.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
      - name: create_validators_arity_mismatch
        symptom: 'createValidators reports a long tuple or overload error around missing or extra run functions.'
        correction: 'Pass exactly one run function for each option config.'
        evidence:
          - packages/form-core/tests/validation.test-d.ts
      - name: form_group_scope_mismatch
        symptom: 'A FormGroup validator or field name complains about missing root fields or invalid paths.'
        correction: 'Use group-scoped values and paths inside the group; reach through group.form only when root form state is intentionally needed.'
        evidence:
          - packages/react-form/tests/FormGroup.test-d.tsx
      - name: field_group_virtual_path_mismatch
        symptom: 'A field group method, watchFields entry, Field, or ArrayField rejects a real form path.'
        correction: 'Use the virtual paths defined by defineFields inside the field group; map them to real paths only through withFields bindings.'
        evidence:
          - packages/react-form/tests/FieldGroupApi.test-d.tsx
      - name: field_group_binding_map_mismatch
        symptom: 'withFields rejects a binding map as incomplete, wrong, or as the internal defineFields object.'
        correction: 'Provide every defined field binding, pass real form paths as bindings, and include the required form prop.'
        evidence:
          - packages/react-form/tests/FieldGroupApi.test-d.tsx
      - name: deep_key_path_shape_mismatch
        symptom: 'A field name or array helper rejects a path involving arrays, optional arrays, readonly arrays, or nullish data.'
        correction: 'Check the DeepKeys path shape, including bracket array segments like users[0].name and array-valued path constraints.'
        evidence:
          - packages/form-core/tests/deep-keys.test-d.ts
      - name: schema_strict_loose_vs_field_strict_loose
        symptom: 'User assumes fieldComponent.strict/loose means strictSchema/looseSchema.'
        correction: 'Explain schema option modes separately from field component value-compatibility branding.'
        evidence:
          - packages/react-form/src/AppForm/getFormHookHelpers.public.ts
          - packages/form-core/src/utils.public.ts
      - name: submit_specific_type_leaks_to_reusable_child
        symptom: 'A reusable child rejects a form because TOnSubmit differs.'
        correction: 'Use shared options without onSubmit or type the child around the intended ReactFormType boundary.'
        evidence:
          - packages/react-form/tests/submit-return.test-d.tsx
      - name: strict_field_group_binding_mismatch
        symptom: 'A field group strict slot rejects a real field path whose value is only assignable in one direction.'
        correction: 'Use a loose field slot when the reusable group should accept wider compatible field values.'
        evidence:
          - packages/react-form/tests/FieldGroupApi.test-d.tsx
          - packages/react-form/src/FieldGroup/withFields.public.ts
      - name: public_api_store_confusion
        symptom: 'Type error mentions missing store because example uses form.store or field.store.'
        correction: 'Use public atom-based APIs and adapter subscriptions.'
        evidence:
          - packages/react-form/tests/FormGroup.test-d.tsx
          - packages/react-form/src/ReactForm/fieldSubscriptions.lib.ts
