      - '@tanstack/form-core'
    core_questions:
      - 'Can incoming data be undefined at first render?'
      - 'Should later defaultValues update untouched fields while preserving touched fields?'
      - 'Is an onSubmit failure transient or validation-related?'
    related_skills:
      - query-backed-forms
      - error-visibility-workflows
      - examples-authoring
  - id: validation-and-error-visibility
    title: Validation And Error Visibility
    description: 'How validators produce errors, how Standard Schema issues are routed, and how visible errors are filtered by form-level or field-level callbacks.'
