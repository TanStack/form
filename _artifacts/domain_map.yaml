    description: 'Gating a form until query data arrives gives correct initial state, while fallback empty values let the UI render immediately.'
    implication: 'Agents may pass maybe-undefined query data directly or choose a loading strategy without matching the visual workflow.'
  - id: validation_state_vs_transient_state
    skills:
      - query-backed-forms
      - schema-driven-forms
      - error-visibility-workflows
    description: 'Validation errors are form state that can block submission; transient query/network/framework failures belong outside validation state.'
    implication: 'Agents may convert retryable endpoint failures into visible field errors and accidentally block the next submit.'
  - id: reuse_vs_inference_boundaries
    skills:
      - react-form-composition-setup
      - reusable-form-policies
      - type-error-debugging
      - examples-authoring
    description: 'Reusable sections improve examples and app code, but the wrong abstraction boundary breaks inference.'
    implication: 'Agents may assert field names, hand-write field props, or union ReactFormType forms instead of using inferred children, helper types, or field groups.'
