# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

reviews:
  request_changes_workflow: false
  slop_detection:
    enabled: true
  auto_review:
    base_branches:
      - alpha
      - main
  path_filters:
    - '!docs/reference/**'
    - '!docs/framework/*/reference/**'

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - 'CONTRIBUTING.md'
