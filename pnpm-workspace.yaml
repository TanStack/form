cleanupUnusedCatalogs: true
linkWorkspacePackages: true
preferWorkspacePackages: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
trustPolicy: no-downgrade
trustPolicyExclude:
  - ua-parser-js@1.0.41 || 0.7.41
  - chokidar@4.0.3
  - semver@6.3.1 || 5.7.2
  - eslint-import-resolver-typescript@3.10.1
packages:
  - packages/**
  - examples/react/**
  - examples/vue/**
  - examples/solid/**
  - examples/svelte/*
  - examples/preact/**
  - examples/angular/**
  - examples/lit/**
allowBuilds:
  nx: true
  unrs-resolver: false
  esbuild: true
  msw: true
  '@swc/core': true
  '@parcel/watcher': false
  lmdb: false
  msgpackr-extract: false
  vue-demi: false
  sharp: false
minimumReleaseAgeExclude:
  - '@tanstack/typedoc-config@0.3.4'
  # Solid 2.0 stable: published 2026-11-17, less than 24 hours ago
  - 'solid-js@2.0.0'
  - '@solidjs/signals@2.0.0'
  - '@solidjs/web@2.0.0'
  - '@solidjs/vite-plugin@3.0.0'
  - '@solidjs/compiler@2.0.0'
  - '@solidjs/compiler-darwin-arm64@2.0.0'
  - '@solidjs/compiler-darwin-x64@2.0.0'
  - '@solidjs/compiler-linux-arm64-gnu@2.0.0'
  - '@solidjs/compiler-linux-x64-gnu@2.0.0'
  - '@solidjs/compiler-wasm32-wasi@2.0.0'
  - '@solidjs/compiler-win32-x64-msvc@2.0.0'
